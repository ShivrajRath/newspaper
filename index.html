<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Brief</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfaf4;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #dcd6c5;
            --accent-color: #2f3d3a;
            --ticker-bg: #f6efe1;
            --muted-text: #6d6759;
            --shadow-color: rgba(26, 26, 26, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #fcfaf4 0%, #f8f2e8 100%);
            color: var(--text-color);
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 45px;
            line-height: 1.65;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--accent-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-family: "Newsreader", Georgia, serif;
            font-size: clamp(2.4rem, 4vw, 3.3rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin: 0;
            color: var(--accent-color);
        }

        .meta-line {
            font-size: 0.95rem;
            color: var(--muted-text);
            margin-top: 8px;
        }

        .header-badges {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .city-badge,
        .edition-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .print-btn {
            border: 1px solid var(--border-color);
            background: var(--accent-color);
            color: white;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .quote-card {
            background: linear-gradient(135deg, #f8efe0 0%, #fffdf8 100%);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .quote-text {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.28rem;
            font-style: italic;
            margin: 0 0 10px 0;
            line-height: 1.45;
            color: var(--accent-color);
        }

        .quote-author {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-text);
            margin: 0;
        }

        .ticker-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background-color: var(--ticker-bg);
            padding: 12px 15px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            margin-bottom: 28px;
        }

        .ticker-bar span {
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
        }

        .grid {
            column-count: 1;
            column-gap: 20px;
            column-fill: balance;
        }

        .card {
            background: var(--card-bg);
            padding: 22px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-color);
            margin: 0 0 20px;
            break-inside: avoid;
            page-break-inside: avoid;
            display: inline-block;
            width: 100%;
            vertical-align: top;
        }

        .card h2 {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            padding: 10px 0;
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            color: var(--accent-color);
        }

        .summary-body {
            font-size: 0.96rem;
            margin-bottom: 14px;
            color: var(--text-color);
        }

        .lead-card .summary-body::first-letter {
            float: left;
            font-family: "Newsreader", Georgia, serif;
            font-size: 3rem;
            line-height: 0.8;
            margin: 0.12em 0.2em 0 0;
            color: var(--accent-color);
        }

        .article-links {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            padding-top: 6px;
        }

        .article-links .article-item {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(220, 214, 197, 0.75);
        }

        .article-links .article-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .article-links strong {
            display: inline-block;
            font-family: "Newsreader", Georgia, serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--text-color);
        }

        .article-links p {
            margin: 4px 0 0 0;
            color: var(--muted-text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .article-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .article-links a:hover {
            text-decoration: underline;
        }

        .no-print {
            display: block;
        }

        @media (min-width: 900px) {
            .grid {
                column-count: 3;
            }
        }

        @media (max-width: 720px) {
            .grid {
                column-count: 1;
            }

            h1 {
                font-size: 2.2rem;
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 12mm;
            }

            body {
                max-width: none;
                padding: 0;
                background: white;
                color: #111;
                font-size: 10.5pt;
            }

            .no-print {
                display: none !important;
            }

            .quote-card,
            .card {
                box-shadow: none;
                break-inside: avoid-column;
                page-break-inside: avoid;
                background: white;
                display: block;
                width: 100%;
            }

            .grid {
                column-count: 2;
                column-gap: 12pt;
                column-fill: auto;
            }

            .article-links a {
                color: #111;
                text-decoration: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>The Daily Brief</h1>
        <div class="meta-line" id="gen-date">Loading publication date...</div>
        <div class="header-badges">
            <span class="city-badge">Dallas, TX</span>
            <span class="edition-badge">Daily Edition</span>
        </div>
    </header>

    <div class="toolbar no-print">
        <button class="print-btn" onclick="window.print()">Print this edition</button>
    </div>

    <div class="quote-card" id="quote-card">
        <p class="quote-text" id="quote-text">Loading quote...</p>
        <p class="quote-author" id="quote-author"></p>
    </div>

    <div class="ticker-bar" id="ticker-bar">Loading market data...</div>

    <div class="grid" id="content-grid">Loading articles...</div>

    <script>
        async function loadNewspaper() {
            try {
                const response = await fetch('newspaper.json');
                const data = await response.json();

                document.getElementById('gen-date').textContent = `Edition: ${data.generated_at || data.date || 'Unknown'}`;

                const quote = data.quote || {};
                document.getElementById('quote-text').textContent = quote.text || 'Make each day your masterpiece.';
                document.getElementById('quote-author').textContent = quote.author ? `— ${quote.author}` : '';

                // Render Market Ticker Bar
                const tickerHTML = Object.entries(data.market || {})
                    .map(([symbol, value]) => `<span><strong>${symbol}:</strong> ${value}</span>`)
                    .join('');
                document.getElementById('ticker-bar').innerHTML = tickerHTML || '<span>Market data unavailable</span>';

                // Helper to strip HTML tags and remove empty bullet-only lines
                const stripHtml = (s) => {
                    if (!s) return '';
                    s = s.replace(/<a[^>]*>(.*?)<\/a>/gi, '$1');
                    s = s.replace(/<[^>]+>/g, ' ');
                    s = s.replace(/\s+/g, ' ').trim();
                    const lines = s.split(/\n|\\r/).map(l => l.trim()).filter(l => {
                        return !(l === '•' || l === '-' || /^[-•*\s]+$/.test(l) || l === '');
                    });
                    return lines.join('\n');
                };

                // Render News Categories
                let gridHTML = Object.entries(data.categories || {}).map(([catName, details], index) => {
                    const articlesHTML = (details.articles || []).map(art => {
                        const t = stripHtml(art.title) || 'Untitled';
                        const summ = stripHtml(art.summary);
                        const titleHTML = `<strong>${t}</strong>`;
                        return `<div class="article-item">${titleHTML}${summ ? `<p>${summ}</p>` : ''}</div>`;
                    }).join('');
                    const bodyText = stripHtml(details.summary || '');
                    const summaryBlock = bodyText ? `<div class="summary-body">${bodyText.replace(/\n/g, '<br>')}</div>` : '';

                    return `
                        <div class="card${index === 0 ? ' lead-card' : ''}">
                            <h2>${catName}</h2>
                            ${summaryBlock}
                            <div class="article-links">${articlesHTML || '<span>No articles available from this section.</span>'}</div>
                        </div>
                    `;
                }).join('');

                // Render Hacker News Card
                if (data.hacker_news && data.hacker_news.length > 0) {
                    const hnItems = data.hacker_news.map(hn => {
                        const title = stripHtml(hn.title || 'Untitled');
                        const desc = stripHtml(hn.description || '');
                        const titleHTML = `<a href="${hn.url}" target="_blank" rel="noopener noreferrer"><strong>${title}</strong></a>`;
                        return `<div class="article-item">${titleHTML}${desc ? `<p>${desc}</p>` : ''} <small style="color: #666;">(${hn.score} pts)</small></div>`;
                    }).join('');

                    gridHTML += `
                        <div class="card no-print">
                            <h2>Hacker News Top Stories</h2>
                            <div class="article-links" style="border-top: none; padding-top: 0;">${hnItems}</div>
                        </div>
                    `;
                }

                document.getElementById('content-grid').innerHTML = gridHTML;

            } catch (err) {
                console.error(err);
                document.getElementById('content-grid').innerHTML = `
                    <div class="card">
                        <h2>Unable to load newspaper</h2>
                        <p>Please ensure <code>newspaper.json</code> has been generated and pushed to the repository.</p>
                    </div>
                `;
            }
        }

        loadNewspaper();
    </script>
</body>

</html>
