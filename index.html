<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">The Daily Brief - Your Personal Newspaper</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111111'/><path d='M28 25 h44 a5 5 0 0 1 5 5 v40 a5 5 0 0 1 -5 5 h-44 a5 5 0 0 1 -5 -5 v-40 a5 5 0 0 1 5 -5 Z' fill='%23fdfbf7'/><line x1='35' y1='36' x2='65' y2='36' stroke='%23111111' stroke-width='4' stroke-linecap='round'/><line x1='35' y1='46' x2='65' y2='46' stroke='%23111111' stroke-width='4' stroke-linecap='round'/><line x1='35' y1='56' x2='53' y2='56' stroke='%23111111' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfaf4;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #dcd6c5;
            --accent-color: #2f3d3a;
            --muted-text: #6d6759;
            --shadow-color: rgba(26, 26, 26, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f5f5f5;
            --border-color: #444444;
            --accent-color: #e8e8e8;
            --muted-text: #aaaaaa;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] .ticker-bar .positive {
            color: #4ade80;
        }

        [data-theme="dark"] .ticker-bar .negative {
            color: #f87171;
        }



        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 45px;
            line-height: 1.65;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--accent-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
            transition: border-color 0.3s ease;
        }

        h1 {
            font-family: "Newsreader", Georgia, serif;
            font-size: clamp(2.4rem, 4vw, 3.3rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin: 0;
            color: var(--accent-color);
        }

        .meta-line {
            font-size: 0.95rem;
            color: var(--muted-text);
            margin-top: 8px;
        }

        .header-badges {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }

        .city-badge,
        .edition-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--card-bg);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent-color);
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .print-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .print-icon-btn:hover {
            background: var(--accent-color);
        }

        .print-icon-btn:hover svg {
            stroke: white;
        }

        .print-icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent-color);
            stroke-width: 2;
            fill: none;
            transition: stroke 0.2s ease;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--accent-color);
        }

        .theme-toggle-btn:hover svg {
            stroke: white;
        }

        .theme-toggle-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent-color);
            stroke-width: 2;
            fill: none;
            transition: stroke 0.2s ease;
        }



        .quote-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 10px var(--shadow-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .quote-text {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.28rem;
            font-style: italic;
            margin: 0 0 10px 0;
            line-height: 1.45;
            color: var(--accent-color);
        }

        .quote-author {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-text);
            margin: 0;
        }

        .ticker-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 12px 15px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 28px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .ticker-bar .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .ticker-bar .ticker-label {
            font-family: "Newsreader", Georgia, serif;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--accent-color);
        }

        .ticker-bar .ticker-value {
            color: var(--text-color);
            font-weight: 700;
        }

        .ticker-bar .ticker-change {
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
        }

        .ticker-bar .positive {
            color: #1f6d33;
        }

        .ticker-bar .negative {
            color: #a1302f;
        }

        .grid {
            column-count: 1;
            column-gap: 20px;
            column-fill: balance;
        }

        .end-sign {
            text-align: center;
            font-family: "Newsreader", Georgia, serif;
            color: var(--muted-text);
            margin: 28px 0 8px;
            font-size: 0.98rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            padding: 22px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-color);
            margin: 0 0 20px;
            break-inside: avoid;
            page-break-inside: avoid;
            display: inline-block;
            width: 100%;
            vertical-align: top;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .card h2 {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            padding: 10px 0;
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            color: var(--accent-color);
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .article-links {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            padding-top: 6px;
        }

        .article-links .article-item {
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }

        .article-links .article-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .article-links strong {
            display: block;
            font-family: "Newsreader", Georgia, serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .article-links p {
            margin: 0;
            color: var(--muted-text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        .article-links small {
            color: #5c5a50;
            display: block;
            margin-top: 8px;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
        }

        .article-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .article-links a:hover {
            text-decoration: underline;
        }

        .no-print {
            display: block;
        }

        @media (min-width: 900px) {
            .grid {
                column-count: 3;
            }
        }

        @media (max-width: 720px) {
            .grid {
                column-count: 1;
            }

            h1 {
                font-size: 2.2rem;
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 8mm;
            }

            html {
                --bg-color: #ffffff !important;
                --card-bg: #ffffff !important;
                --text-color: #111111 !important;
                --border-color: #dcd6c5 !important;
                --accent-color: #2f3d3a !important;
                --muted-text: #6d6759 !important;
                --shadow-color: rgba(26, 26, 26, 0.05) !important;
            }

            html[data-theme] {
                --bg-color: #ffffff !important;
                --card-bg: #ffffff !important;
                --text-color: #111111 !important;
                --border-color: #dcd6c5 !important;
                --accent-color: #2f3d3a !important;
                --muted-text: #6d6759 !important;
                --shadow-color: rgba(26, 26, 26, 0.05) !important;
            }

            body {
                max-width: none;
                padding: 0;
                margin: 0;
                background: white;
                color: #111;
                font-size: 9pt;
                line-height: 1.4;
            }

            .no-print {
                display: none !important;
            }

            .quote-card,
            .card {
                box-shadow: none;
                break-inside: avoid-column;
                page-break-inside: avoid;
                /* Strip all colored backgrounds and borders — flat white */
                background: var(--card-bg) !important;
                display: block;
                width: 100%;
                border: none !important;
                border-radius: 0;
                margin: 0 0 8px 0;
                padding: 6px 4px 8px 4px;
            }

            /* Use 2-column layout for better space utilization on A4 */
            .grid {
                column-count: 2 !important;
                column-gap: 8mm !important;
                column-fill: balance !important;
                -webkit-column-count: 2 !important;
                -webkit-column-gap: 8mm !important;
                -webkit-column-fill: balance !important;
                -moz-column-count: 2 !important;
                -moz-column-gap: 8mm !important;
                -moz-column-fill: balance !important;
            }

            /* Reduce spacing inside lists and article items */
            .article-links .article-item {
                margin-bottom: 6px;
                padding-bottom: 4px;
                border-bottom: 1px solid rgba(220, 214, 197, 0.35);
            }

            .ticker-bar {
                padding: 4px 6px;
                margin-bottom: 6px;
                font-size: 0.75rem;
                border: none !important;
            }

            .ticker-bar .ticker-item {
                border: none !important;
            }

            .quote-card {
                padding: 6px 4px;
                margin-bottom: 4px;
            }

            .quote-text {
                font-size: 1rem;
            }

            .end-sign {
                margin: 6px 0 4px;
                font-size: 0.85rem;
            }

            /* Section headers: keep only a top rule as the delimiter */
            .card h2 {
                border-top: 1.5px solid #aaa;
                border-bottom: none;
                padding: 4px 0;
                margin-bottom: 4px;
                font-size: 0.95rem;
            }



            .article-links a {
                color: #111;
                text-decoration: none;
            }

            .article-links p {
                font-size: 0.85rem;
                line-height: 1.5;
            }

            .article-links small {
                font-size: 0.75rem;
            }

            /* Optimize header for print */
            header {
                padding-bottom: 8px;
                margin-bottom: 12px;
                border-bottom: none !important;
            }

            h1 {
                font-size: 1.8rem;
            }

            .meta-line {
                font-size: 0.8rem;
            }

            .header-badges {
                margin-top: 6px;
            }

            .city-badge,
            .edition-badge {
                font-size: 0.65rem;
                padding: 4px 8px;
            }

            /* Riddle print styles - show answer on print */
            .riddle-answer {
                display: block !important;
                transform: rotate(180deg) scaleX(-1);
                margin: 12px 0;
                padding: 8px;
                background: #f5f5f5;
                border: 1px solid #ccc;
                -webkit-transform: rotate(180deg) scaleX(-1);
                -moz-transform: rotate(180deg) scaleX(-1);
            }

            .show-answer-btn {
                display: none !important;
            }

            .riddle-answer-container {
                border-top: none;
            }

            /* Ensure joke cards are visible in print */
            .joke-card {
                display: block !important;
            }

            .joke-card[hidden] {
                display: block !important;
            }

            /* Ensure all cards with hidden attribute are visible in print */
            [hidden] {
                display: block !important;
            }

            /* Improve column break behavior for mobile */
            .card {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                -webkit-column-break-inside: avoid !important;
            }

            /* Ensure content doesn't get cut off between columns */
            .article-item {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                -webkit-column-break-inside: avoid !important;
            }

            /* Force background colors for better readability (mobile print often disables backgrounds) */
            @media print and (color) {
                * {
                    -webkit-print-color-adjust: exact !important;
                    print-color-adjust: exact !important;
                }
            }

            /* Ensure proper spacing on mobile print */
            .card {
                orphans: 3;
                widows: 3;
            }

            /* Optimize font sizes for mobile readability */
            @media print and (max-width: 480px) {
                body {
                    font-size: 10pt !important;
                }

                .card h2 {
                    font-size: 1rem !important;
                }

                .article-links p {
                    font-size: 0.9rem !important;
                }
            }
        }

        /* ── Weather Card ───────────────────────────────────── */
        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .weather-description {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--accent-color);
            line-height: 1.5;
            text-align: left;
            padding: 8px 0;
        }

        /* ── Word of the Day Card ───────────────────────────── */
        .word-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .word-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .word-title {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 0.03em;
        }

        .word-pos {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            font-style: italic;
            color: var(--muted-text);
            padding: 2px 6px;
            background: rgba(220, 214, 197, 0.25);
            border-radius: 4px;
        }

        .word-def {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-color);
            margin: 0 0 10px 0;
        }

        .word-example {
            font-family: "Newsreader", Georgia, serif;
            font-size: 0.92rem;
            font-style: italic;
            color: var(--muted-text);
            border-left: 2px solid var(--border-color);
            padding-left: 10px;
            margin: 8px 0 0 0;
            line-height: 1.5;
        }

        .word-source {
            display: inline-block;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-text);
            margin-top: 12px;
        }

        /* ── Riddle Card ───────────────────────────────────── */
        .riddle-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .riddle-question {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-color);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .riddle-card[hidden] {
            display: none;
        }

        .riddle-answer-container {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .riddle-answer {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.95rem;
            color: var(--text-color);
            line-height: 1.6;
            display: none;
        }

        .riddle-answer.visible {
            display: block;
        }

        .show-answer-btn {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--accent-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .show-answer-btn:hover {
            background: var(--accent-color);
            color: var(--card-bg);
        }

        /* ── Joke Card ───────────────────────────────────── */
        .joke-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .joke-setup {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-color);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .joke-content {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-color);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .joke-delivery {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.95rem;
            color: var(--text-color);
            line-height: 1.6;
            font-style: italic;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(220, 214, 197, 0.15);
            border-radius: 6px;
            border-left: 3px solid var(--border-color);
        }

        .joke-card[hidden] {
            display: none;
        }




    </style>
</head>

<body>

    <header>
        <h1>The Daily Brief</h1>
        <div class="header-badges">
            <span class="edition-badge" id="edition-badge">Frisco, TX · Daily Edition</span>
            <button class="theme-toggle-btn no-print" onclick="toggleTheme()" aria-label="Toggle theme">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round"
                    stroke-linejoin="round" id="theme-icon">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <button class="print-icon-btn no-print" onclick="window.print()" aria-label="Print">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
            </button>
        </div>
    </header>

    <div class="quote-card" id="quote-card">
        <p class="quote-text" id="quote-text">Loading quote...</p>
        <p class="quote-author" id="quote-author"></p>
    </div>

    <div class="ticker-bar" id="ticker-bar">Loading market data...</div>

    <div class="grid" id="content-grid">Loading articles...</div>

    <div class="end-sign" id="end-sign">— End of Paper —</div>

    <div class="print-footer" aria-hidden="true"></div>

    <script>
        async function loadNewspaper() {
            try {
                const response = await fetch('newspaper.json');
                const data = await response.json();

                const formattedDate = new Date().toLocaleDateString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
                const pageTitle = `The Daily Brief - ${formattedDate}`;
                document.title = pageTitle;
                document.getElementById('page-title').textContent = pageTitle;
                document.getElementById('edition-badge').textContent = `Frisco, TX · Daily Edition · ${data.generated_at || data.date || 'Unknown'}`;

                const quote = data.quote || {};
                document.getElementById('quote-text').textContent = quote.text || 'Make each day your masterpiece.';
                document.getElementById('quote-author').textContent = quote.author ? `— ${quote.author}` : '';

                // Render Market Ticker Bar
                const tickerHTML = Object.entries(data.market || {})
                    .map(([symbol, value]) => {
                        const parsed = String(value).match(/^\$(\d+(?:\.\d+)?)\s*\(([^)]+)\)$/);
                        if (!parsed) {
                            return `<span class="ticker-item"><span class="ticker-label">${symbol}</span><span class="ticker-value">${value}</span></span>`;
                        }
                        const price = parsed[1];
                        const change = parsed[2];
                        const changeClass = change.trim().startsWith('+') ? 'positive' : change.trim().startsWith('-') ? 'negative' : '';
                        return `<span class="ticker-item"><span class="ticker-label">${symbol}</span><span class="ticker-value">$${price}</span><span class="ticker-change ${changeClass}">${change}</span></span>`;
                    })
                    .join('');
                document.getElementById('ticker-bar').innerHTML = tickerHTML || '<span>Market data unavailable</span>';

                // Helper to strip HTML tags and remove empty bullet-only lines
                const stripHtml = (s) => {
                    if (!s) return '';
                    s = s.replace(/<a[^>]*>(.*?)<\/a>/gi, '$1');
                    s = s.replace(/<[^>]+>/g, ' ');
                    s = s.replace(/\s+/g, ' ').trim();
                    const lines = s.split(/\n|\\r/).map(l => l.trim()).filter(l => {
                        return !(l === '•' || l === '-' || /^[-•*\s]+$/.test(l) || l === '');
                    });
                    return lines.join('\n');
                };

                // Render News Categories
                let gridHTML = Object.entries(data.categories || {}).map(([catName, details], index) => {
                    const articlesHTML = (details.articles || []).map(art => {
                        const t = stripHtml(art.title) || 'Untitled';
                        const summ = stripHtml(art.summary);
                        const titleHTML = `<strong>${t}</strong>`;
                        return `<div class="article-item">${titleHTML}${summ ? `<p>${summ}</p>` : ''}</div>`;
                    }).join('');
                    if (!articlesHTML) return '';

                    return `
                        <div class="card${index === 0 ? ' lead-card' : ''}">
                            <h2>${catName}</h2>
                            <div class="article-links">${articlesHTML}</div>
                        </div>
                    `;
                }).join('');

                // Render Hacker News Card
                if (data.hacker_news && data.hacker_news.length > 0) {
                    const hnItems = data.hacker_news.map(hn => {
                        const title = stripHtml(hn.title || 'Untitled');
                        const desc = stripHtml(hn.description || '');
                        const titleHTML = `<a href="${hn.url}" target="_blank" rel="noopener noreferrer"><strong>${title}</strong></a>`;
                        return `<div class="article-item">${titleHTML}${desc ? `<p>${desc}</p>` : ''}</div>`;
                    }).join('');

                    gridHTML += `
                        <div class="card no-print">
                            <h2>Hacker News Top Stories</h2>
                            <div class="article-links" style="border-top: none; padding-top: 0;">${hnItems}</div>
                        </div>
                    `;
                }

                // ── Render Extras (Weather & Word of the Day) ──
                let extrasHTML = '';

                // Word of the Day Card
                const wod = data.word_of_day;
                if (wod && wod.word) {
                    const word = stripHtml(wod.word);
                    const pos = stripHtml(wod.part_of_speech || '');
                    const def = stripHtml(wod.definition || '');
                    const ex = stripHtml(wod.example || '');
                    const source = wod.source ? stripHtml(wod.source).trim() : '';

                    let sourceHTML = '';
                    if (source.toLowerCase() === 'wordnik') {
                        sourceHTML = `<div class="word-source">Source: Wordnik</div>`;
                    }

                    extrasHTML += `
                        <div class="card word-card">
                            <h2>📖 Word of the Day</h2>
                            <div class="word-header">
                                <span class="word-title">${word}</span>
                                ${pos ? `<span class="word-pos">${pos}</span>` : ''}
                            </div>
                            ${def ? `<p class="word-def">${def}</p>` : ''}
                            ${ex ? `<p class="word-example">"${ex}"</p>` : ''}
                            ${sourceHTML}
                        </div>
                    `;
                }

                // Weather Card
                const wx = data.weather || {};
                if (wx.description) {
                    extrasHTML += `
                        <div class="card weather-card">
                            <h2>📍 ${wx.location || 'Frisco, TX'} Weather</h2>
                            <div class="weather-description">${wx.description}</div>
                        </div>
                    `;
                }

                // Riddle Card
                const riddle = data.riddle;
                if (riddle && riddle.question) {
                    extrasHTML += `
                        <div class="card riddle-card" id="riddle-card">
                            <h2>🧩 Daily Riddle</h2>
                            <div class="riddle-question" id="riddle-question">${riddle.question}</div>
                            <div class="riddle-answer-container">
                                <button class="show-answer-btn no-print" onclick="toggleRiddleAnswer()">Show Answer</button>
                                <div class="riddle-answer" id="riddle-answer">${riddle.answer}</div>
                            </div>
                        </div>
                    `;
                }

                // Joke Card
                const joke = data.joke;
                if (joke) {
                    if (joke.type === 'single' && joke.content) {
                        extrasHTML += `
                            <div class="card joke-card" id="joke-card">
                                <h2>😄 Kids' Joke of the Day</h2>
                                <div class="joke-content">${joke.content}</div>
                            </div>
                        `;
                    } else if (joke.type === 'twopart' && joke.setup && joke.delivery) {
                        extrasHTML += `
                            <div class="card joke-card" id="joke-card">
                                <h2>😄 Kids' Joke of the Day</h2>
                                <div class="joke-setup">${joke.setup}</div>
                                <div class="joke-delivery">${joke.delivery}</div>
                            </div>
                        `;
                    }
                }

                document.getElementById('content-grid').innerHTML = gridHTML + extrasHTML;

            } catch (err) {
                console.error(err);
                document.getElementById('content-grid').innerHTML = `
                    <div class="card">
                        <h2>Unable to load newspaper</h2>
                        <p>Please ensure <code>newspaper.json</code> has been generated and pushed to the repository.</p>
                    </div>
                `;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (theme === 'dark') {
                icon.innerHTML = `
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                `;
            } else {
                icon.innerHTML = `
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                `;
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            let theme;
            if (savedTheme) {
                theme = savedTheme;
            } else {
                // Check system preference
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function toggleRiddleAnswer() {
            const answer = document.getElementById('riddle-answer');
            const btn = document.querySelector('.show-answer-btn');
            
            if (!answer || !btn) return;
            
            if (answer.classList.contains('visible')) {
                answer.classList.remove('visible');
                btn.textContent = 'Show Answer';
            } else {
                answer.classList.add('visible');
                btn.textContent = 'Hide Answer';
            }
        }

        loadTheme();
        loadNewspaper();
    </script>
</body>

</html>
