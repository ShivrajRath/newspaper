<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">The Daily Brief - Your Personal Newspaper</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111111'/><path d='M28 25 h44 a5 5 0 0 1 5 5 v40 a5 5 0 0 1 -5 5 h-44 a5 5 0 0 1 -5 -5 v-40 a5 5 0 0 1 5 -5 Z' fill='%23fdfbf7'/><line x1='35' y1='36' x2='65' y2='36' stroke='%23111111' stroke-width='4' stroke-linecap='round'/><line x1='35' y1='46' x2='65' y2='46' stroke='%23111111' stroke-width='4' stroke-linecap='round'/><line x1='35' y1='56' x2='53' y2='56' stroke='%23111111' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfaf4;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #dcd6c5;
            --accent-color: #2f3d3a;
            --ticker-bg: #f6efe1;
            --muted-text: #6d6759;
            --shadow-color: rgba(26, 26, 26, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #fcfaf4 0%, #f8f2e8 100%);
            color: var(--text-color);
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 45px;
            line-height: 1.65;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--accent-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-family: "Newsreader", Georgia, serif;
            font-size: clamp(2.4rem, 4vw, 3.3rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin: 0;
            color: var(--accent-color);
        }

        .meta-line {
            font-size: 0.95rem;
            color: var(--muted-text);
            margin-top: 8px;
        }

        .header-badges {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 10px;
            margin-top: 12px;
            align-items: center;
        }

        .city-badge,
        .edition-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        .print-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .print-icon-btn:hover {
            background: var(--accent-color);
        }

        .print-icon-btn:hover svg {
            stroke: white;
        }

        .print-icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent-color);
            stroke-width: 2;
            fill: none;
            transition: stroke 0.2s ease;
        }



        .quote-card {
            background: linear-gradient(135deg, #f8efe0 0%, #fffdf8 100%);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .quote-text {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.28rem;
            font-style: italic;
            margin: 0 0 10px 0;
            line-height: 1.45;
            color: var(--accent-color);
        }

        .quote-author {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-text);
            margin: 0;
        }

        .ticker-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background-color: var(--ticker-bg);
            padding: 12px 15px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 28px;
        }

        .ticker-bar .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(220, 214, 197, 0.85);
        }

        .ticker-bar .ticker-label {
            font-family: "Newsreader", Georgia, serif;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--accent-color);
        }

        .ticker-bar .ticker-value {
            color: var(--text-color);
            font-weight: 700;
        }

        .ticker-bar .ticker-change {
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
        }

        .ticker-bar .positive {
            color: #1f6d33;
        }

        .ticker-bar .negative {
            color: #a1302f;
        }

        .grid {
            column-count: 1;
            column-gap: 20px;
            column-fill: balance;
        }

        .end-sign {
            text-align: center;
            font-family: "Newsreader", Georgia, serif;
            color: var(--muted-text);
            margin: 28px 0 8px;
            font-size: 0.98rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            padding: 22px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-color);
            margin: 0 0 20px;
            break-inside: avoid;
            page-break-inside: avoid;
            display: inline-block;
            width: 100%;
            vertical-align: top;
        }

        .card h2 {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.02rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            padding: 10px 0;
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            color: var(--accent-color);
        }

        .summary-body {
            font-size: 0.96rem;
            margin-bottom: 14px;
            color: var(--text-color);
        }

        .lead-card .summary-body::first-letter {
            float: left;
            font-family: "Newsreader", Georgia, serif;
            font-size: 3rem;
            line-height: 0.8;
            margin: 0.12em 0.2em 0 0;
            color: var(--accent-color);
        }

        .article-links {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            padding-top: 6px;
        }

        .article-links .article-item {
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(220, 214, 197, 0.65);
        }

        .article-links .article-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .article-links strong {
            display: block;
            font-family: "Newsreader", Georgia, serif;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .article-links p {
            margin: 0;
            color: var(--muted-text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.92rem;
            line-height: 1.7;
        }

        .article-links small {
            color: #5c5a50;
            display: block;
            margin-top: 8px;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
        }

        .article-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .article-links a:hover {
            text-decoration: underline;
        }

        .no-print {
            display: block;
        }

        @media (min-width: 900px) {
            .grid {
                column-count: 3;
            }
        }

        @media (max-width: 720px) {
            .grid {
                column-count: 1;
            }

            h1 {
                font-size: 2.2rem;
            }
        }

        @media print {
            @page {
                size: A4;
                margin: 10mm;
            }

            body {
                max-width: none;
                padding: 0;
                margin: 0;
                background: white;
                color: #111;
                font-size: 10.5pt;
            }

            .no-print {
                display: none !important;
            }

            .quote-card,
            .card {
                box-shadow: none;
                break-inside: avoid-column;
                page-break-inside: avoid;
                /* Strip all colored backgrounds and borders — flat white */
                background: white !important;
                display: block;
                width: 100%;
                border: none !important;
                border-radius: 0;
                margin: 0 0 10px 0;
                padding: 8px 6px 10px 6px;
            }

            /* Use a single stacked column for print so each section uses full width */
            .grid {
                column-count: 1;
                column-gap: 0;
                column-fill: auto;
            }

            /* Reduce spacing inside lists and article items */
            .article-links .article-item {
                margin-bottom: 8px;
                padding-bottom: 6px;
                border-bottom: 1px solid rgba(220, 214, 197, 0.35);
            }

            .ticker-bar {
                padding: 6px 8px;
                margin-bottom: 8px;
            }

            .quote-card {
                padding: 8px 6px;
                margin-bottom: 6px;
            }

            .end-sign {
                margin: 8px 0 6px;
                font-size: 0.9rem;
            }

            /* Section headers: keep only a top rule as the delimiter */
            .card h2 {
                border-top: 1.5px solid #aaa;
                border-bottom: none;
                padding: 6px 0;
                margin-bottom: 6px;
            }

            /* Strip puzzle card coloured stat boxes */
            .puzzle-stat {
                background: transparent !important;
                border: none !important;
            }

            /* Hide puzzle interactive buttons and answer/hint in print */
            .puzzle-hint-toggle,
            .puzzle-reveal-btn,
            .puzzle-hint-text,
            .puzzle-answer-text,
            .puzzle-type-badge {
                display: none !important;
            }

            .article-links a {
                color: #111;
                text-decoration: none;
            }
        }

        /* ── Weather Card ───────────────────────────────────── */
        .weather-card {
            background: linear-gradient(135deg, #e8f4fd 0%, #f0f8ff 100%);
            border: 1px solid #b8d8f0;
        }

        .weather-description {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--accent-color);
            line-height: 1.5;
            text-align: center;
            padding: 8px 0;
        }

        /* ── Word of the Day Card ───────────────────────────── */
        .wotd-word {
            font-family: "Newsreader", Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0 0 2px 0;
            line-height: 1.1;
        }

        .wotd-pos {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted-text);
            display: block;
            margin-bottom: 12px;
        }

        .wotd-definition {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .wotd-example {
            font-family: "Newsreader", Georgia, serif;
            font-size: 0.93rem;
            font-style: italic;
            color: var(--muted-text);
            border-left: 3px solid var(--border-color);
            padding-left: 12px;
            margin: 0;
        }

        /* ── Puzzle Card ────────────────────────────────────── */
        .puzzle-card {
            background: linear-gradient(135deg, #fdf8e8 0%, #fffdf5 100%);
            border: 1px solid #e2d4a0;
        }

        .puzzle-type-badge {
            display: inline-block;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #8b6914;
            background: rgba(226, 212, 160, 0.45);
            border: 1px solid rgba(226, 212, 160, 0.8);
            border-radius: 999px;
            padding: 3px 10px;
            margin-bottom: 14px;
        }

        .puzzle-question {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.08rem;
            line-height: 1.6;
            color: var(--accent-color);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .puzzle-hint-toggle {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-text);
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 14px;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s;
        }

        .puzzle-hint-toggle:hover {
            background: rgba(220, 214, 197, 0.35);
        }

        .puzzle-reveal-btn {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: white;
            background: var(--accent-color);
            border: none;
            border-radius: 999px;
            padding: 5px 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .puzzle-reveal-btn:hover {
            opacity: 0.85;
        }

        .puzzle-hint-text {
            font-size: 0.88rem;
            color: var(--muted-text);
            font-style: italic;
            margin-top: 12px;
            display: none;
        }

        .puzzle-answer-text {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: #1f6d33;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>The Daily Brief</h1>
        <div class="header-badges">
            <span class="edition-badge" id="edition-badge">Frisco, TX · Daily Edition</span>
            <button class="print-icon-btn no-print" onclick="window.print()" aria-label="Print">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
            </button>
        </div>
    </header>

    <div class="quote-card" id="quote-card">
        <p class="quote-text" id="quote-text">Loading quote...</p>
        <p class="quote-author" id="quote-author"></p>
    </div>

    <div class="ticker-bar" id="ticker-bar">Loading market data...</div>

    <div class="grid" id="content-grid">Loading articles...</div>

    <div class="end-sign" id="end-sign">— End of Paper —</div>

    <div class="print-footer" aria-hidden="true"></div>

    <script>
        async function loadNewspaper() {
            try {
                const response = await fetch('newspaper.json');
                const data = await response.json();

                const formattedDate = new Date().toLocaleDateString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
                const pageTitle = `The Daily Brief - ${formattedDate}`;
                document.title = pageTitle;
                document.getElementById('page-title').textContent = pageTitle;
                document.getElementById('edition-badge').textContent = `Frisco, TX · Daily Edition · ${data.generated_at || data.date || 'Unknown'}`;

                const quote = data.quote || {};
                document.getElementById('quote-text').textContent = quote.text || 'Make each day your masterpiece.';
                document.getElementById('quote-author').textContent = quote.author ? `— ${quote.author}` : '';

                // Render Market Ticker Bar
                const tickerHTML = Object.entries(data.market || {})
                    .map(([symbol, value]) => {
                        const parsed = String(value).match(/^\$(\d+(?:\.\d+)?)\s*\(([^)]+)\)$/);
                        if (!parsed) {
                            return `<span class="ticker-item"><span class="ticker-label">${symbol}</span><span class="ticker-value">${value}</span></span>`;
                        }
                        const price = parsed[1];
                        const change = parsed[2];
                        const changeClass = change.trim().startsWith('+') ? 'positive' : change.trim().startsWith('-') ? 'negative' : '';
                        return `<span class="ticker-item"><span class="ticker-label">${symbol}</span><span class="ticker-value">$${price}</span><span class="ticker-change ${changeClass}">${change}</span></span>`;
                    })
                    .join('');
                document.getElementById('ticker-bar').innerHTML = tickerHTML || '<span>Market data unavailable</span>';

                // Helper to strip HTML tags and remove empty bullet-only lines
                const stripHtml = (s) => {
                    if (!s) return '';
                    s = s.replace(/<a[^>]*>(.*?)<\/a>/gi, '$1');
                    s = s.replace(/<[^>]+>/g, ' ');
                    s = s.replace(/\s+/g, ' ').trim();
                    const lines = s.split(/\n|\\r/).map(l => l.trim()).filter(l => {
                        return !(l === '•' || l === '-' || /^[-•*\s]+$/.test(l) || l === '');
                    });
                    return lines.join('\n');
                };

                // Render News Categories
                let gridHTML = Object.entries(data.categories || {}).map(([catName, details], index) => {
                    const articlesHTML = (details.articles || []).map(art => {
                        const t = stripHtml(art.title) || 'Untitled';
                        const summ = stripHtml(art.summary);
                        const titleHTML = `<strong>${t}</strong>`;
                        return `<div class="article-item">${titleHTML}${summ ? `<p>${summ}</p>` : ''}</div>`;
                    }).join('');
                    if (!articlesHTML) return '';

                    const bodyText = stripHtml(details.summary || '');
                    const summaryBlock = bodyText ? `<div class="summary-body">${bodyText.replace(/\n/g, '<br>')}</div>` : '';

                    return `
                        <div class="card${index === 0 ? ' lead-card' : ''}">
                            <h2>${catName}</h2>
                            ${summaryBlock}
                            <div class="article-links">${articlesHTML}</div>
                        </div>
                    `;
                }).join('');

                // Render Hacker News Card
                if (data.hacker_news && data.hacker_news.length > 0) {
                    const hnItems = data.hacker_news.map(hn => {
                        const title = stripHtml(hn.title || 'Untitled');
                        const desc = stripHtml(hn.description || '');
                        const titleHTML = `<a href="${hn.url}" target="_blank" rel="noopener noreferrer"><strong>${title}</strong></a>`;
                        return `<div class="article-item">${titleHTML}${desc ? `<p>${desc}</p>` : ''} <small style="color: #666;">(${hn.score} pts)</small></div>`;
                    }).join('');

                    gridHTML += `
                        <div class="card no-print">
                            <h2>Hacker News Top Stories</h2>
                            <div class="article-links" style="border-top: none; padding-top: 0;">${hnItems}</div>
                        </div>
                    `;
                }

                // ── Render Extras (Weather · Word of Day · Puzzle) ──
                let extrasHTML = '';

                // Weather Card
                const wx = data.weather || {};
                if (wx.description) {
                    extrasHTML += `
                        <div class="card weather-card">
                            <h2>📍 ${wx.location || 'Frisco, TX'} Weather</h2>
                            <div class="weather-description">${wx.description}</div>
                        </div>
                    `;
                }

                // Word of the Day Card
                const wotd = data.word_of_the_day || {};
                if (wotd.word) {
                    const posHtml = wotd.part_of_speech ? `<span class="wotd-pos">${wotd.part_of_speech}</span>` : '';
                    const defHtml = wotd.definition ? `<p class="wotd-definition">${wotd.definition}</p>` : '';
                    const exHtml = wotd.example ? `<p class="wotd-example">“${wotd.example}”</p>` : '';
                    extrasHTML += `
                        <div class="card">
                            <h2>📖 Word of the Day</h2>
                            <p class="wotd-word">${wotd.word}</p>
                            ${posHtml}
                            ${defHtml}
                            ${exHtml}
                        </div>
                    `;
                }

                // Daily Puzzle Card
                const puzzle = data.puzzle || {};
                if (puzzle.question) {
                    extrasHTML += `
                        <div class="card puzzle-card">
                            <h2>🧩 Daily Puzzle</h2>
                            <span class="puzzle-type-badge">${puzzle.type || 'Riddle'}</span>
                            <p class="puzzle-question">${puzzle.question}</p>
                            <div>
                                <button class="puzzle-hint-toggle" id="hint-btn" onclick="toggleHint()">Show Hint</button>
                                <button class="puzzle-reveal-btn" id="reveal-btn" onclick="revealAnswer()">Reveal Answer</button>
                            </div>
                            <p class="puzzle-hint-text" id="puzzle-hint">💡 ${puzzle.hint || ''}</p>
                            <p class="puzzle-answer-text" id="puzzle-answer">✔ ${puzzle.answer || ''}</p>
                        </div>
                    `;
                }

                document.getElementById('content-grid').innerHTML = gridHTML + extrasHTML;

            } catch (err) {
                console.error(err);
                document.getElementById('content-grid').innerHTML = `
                    <div class="card">
                        <h2>Unable to load newspaper</h2>
                        <p>Please ensure <code>newspaper.json</code> has been generated and pushed to the repository.</p>
                    </div>
                `;
            }
        }

        function toggleHint() {
            const el = document.getElementById('puzzle-hint');
            const btn = document.getElementById('hint-btn');
            const shown = el.style.display === 'block';
            el.style.display = shown ? 'none' : 'block';
            btn.textContent = shown ? 'Show Hint' : 'Hide Hint';
        }

        function revealAnswer() {
            const el = document.getElementById('puzzle-answer');
            const btn = document.getElementById('reveal-btn');
            el.style.display = 'block';
            btn.disabled = true;
            btn.style.opacity = '0.5';
        }

        loadNewspaper();
    </script>
</body>

</html>
