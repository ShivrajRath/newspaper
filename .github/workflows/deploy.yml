name: Generate & Deploy Newspaper

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    - cron: "0 12 * * *" # Optional daily automated run at 12:00 UTC (7:00 AM EST)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python Packages
        run: pip install feedparser yfinance google-generativeai

      - name: Run Builder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_newspaper.py

      - name: Deploy Output to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
